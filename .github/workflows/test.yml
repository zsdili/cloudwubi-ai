name: Test AI Engine

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: AI 引擎单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行 AI 引擎测试
        run: python3 test_ai_engine.py
